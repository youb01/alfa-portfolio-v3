    <!-- GitHub Pages SPA: restore path encoded by 404.html -->
    <script>
      (function () {
        try {
          var p = window.location.search.match(/[?&]p=(\/[^&]*)/);
          var q = window.location.search.match(/[?&]q=([^&]*)/);
          if (p) {
            var path = decodeURIComponent(p[1].replace(/~and~/g, '&'));
            var search = q ? '?' + decodeURIComponent(q[1].replace(/~and~/g, '&')) : '';
            window.history.replaceState(null, null, path + search + window.location.hash);
          }
        } catch (e) {}
      })();
    </script>

    <!-- Prevent theme flash - must run before any content renders -->
    <script>
      (function () {
        const theme =
          localStorage.getItem("theme") ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.classList.add(theme);
      })();
    </script>
